<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>나랑 나갈래?</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;background:#FFF8E7;min-height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:16px}
.screen.active{display:flex}
h1{font-size:2rem;font-weight:900;color:#7B5EA7;text-align:center;line-height:1.2}
h2{font-size:1.3rem;font-weight:800;color:#7B5EA7;text-align:center}
p{font-size:.95rem;color:#555;text-align:center;line-height:1.6}
input{width:100%;padding:14px 16px;border:2px solid #C8B6E2;border-radius:16px;font-size:1rem;background:#fff;outline:none;color:#333;text-align:center}
input:focus{border-color:#7B5EA7}
.btn{width:100%;padding:14px;border:none;border-radius:20px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(135deg,#C8B6E2,#9DD9D2);color:#fff}
.btn-sec{background:#fff;border:2px solid #C8B6E2;color:#7B5EA7}
.btn-rose{background:linear-gradient(135deg,#FFB5A7,#ff9a88);color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.card{background:#fff;border-radius:24px;padding:20px;width:100%;box-shadow:0 4px 20px rgba(200,182,226,.3)}
.code-display{font-size:2.5rem;font-weight:900;letter-spacing:.15em;color:#7B5EA7;text-align:center;font-family:monospace}
.player-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:600}
.status-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;width:100%}
.choice-btn{width:100%;padding:18px;border:3px solid transparent;border-radius:20px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s;background:#fff;color:#333}
.choice-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.choice-btn.A{border-color:#FFB5A7}
.choice-btn.A:hover:not(:disabled){background:#FFB5A7;color:#fff}
.choice-btn.B{border-color:#9DD9D2}
.choice-btn.B:hover:not(:disabled){background:#9DD9D2;color:#fff}
.choice-btn.selected{opacity:.5;pointer-events:none}
.choice-btn.picked-A{background:#FFB5A7;color:#fff;border-color:#FFB5A7}
.choice-btn.picked-B{background:#9DD9D2;color:#fff;border-color:#9DD9D2}
.waiting-msg{font-size:.9rem;color:#aaa;text-align:center;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.char-card{padding:12px 6px;border-radius:16px;border:3px solid transparent;text-align:center;cursor:pointer;transition:all .15s;background:#fff}
.char-card:hover:not(.taken){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.char-card.selected-me{border-color:#7B5EA7;background:#EEE8FA}
.char-card.taken{opacity:.35;pointer-events:none}
.char-emoji{font-size:2rem}
.char-name{font-size:.75rem;font-weight:700;margin-top:4px;color:#555}
.result-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#f9f5ff;margin-bottom:8px}
.match-badge{background:linear-gradient(135deg,#FFB5A7,#C8B6E2);color:#fff;padding:4px 10px;border-radius:10px;font-size:.8rem;font-weight:700}
.divider{height:1px;background:#eee;width:100%;margin:4px 0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:20px;font-size:.9rem;font-weight:600;z-index:999;pointer-events:none;animation:fadeup .3s ease}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.q-counter{font-size:.8rem;color:#aaa;text-align:center}
.lobby-icon{font-size:3rem;text-align:center}
.section-label{font-size:.75rem;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;width:100%;text-align:left}
</style>
</head>
<body>
<div id="app">

  <!-- 랜딩 -->
  <div id="s-land" class="screen active">
    <div style="font-size:3.5rem;text-align:center">👸</div>
    <h1>나랑 나갈래?</h1>
    <p style="color:#aaa;font-size:.85rem">함께 플레이할 친구들과<br>각자 폰으로 접속하세요</p>
    <div class="card" style="gap:12px;display:flex;flex-direction:column">
      <input id="inp-name" placeholder="내 이름을 입력해요" maxlength="8">
      <button class="btn btn-pri" onclick="doCreate()">방 만들기 👑</button>
      <div style="display:flex;align-items:center;gap:8px"><div class="divider"></div><span style="color:#ccc;font-size:.8rem;white-space:nowrap">또는</span><div class="divider"></div></div>
      <input id="inp-code" placeholder="초대 코드 6자리" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em" oninput="this.value=this.value.toUpperCase()">
      <button class="btn btn-sec" onclick="doJoin()">입장하기 🚪</button>
    </div>
  </div>

  <!-- 대기실 -->
  <div id="s-wait" class="screen">
    <h2>대기실</h2>
    <div class="card" style="text-align:center">
      <div style="font-size:.8rem;color:#aaa;margin-bottom:4px">초대 코드</div>
      <div class="code-display" id="room-code">------</div>
      <div style="font-size:.75rem;color:#bbb;margin-top:4px">친구에게 코드를 알려주세요</div>
    </div>
    <div class="card">
      <div class="section-label" style="margin-bottom:10px">참가자 <span id="player-count">0</span>명</div>
      <div id="player-list" class="status-bar"></div>
    </div>
    <div class="card">
      <div class="section-label" style="margin-bottom:10px">캐릭터 선택</div>
      <div class="char-grid" id="char-grid"></div>
    </div>
    <button id="btn-start" class="btn btn-pri" onclick="hostStart()" style="display:none">게임 시작 🎮</button>
    <p class="waiting-msg" id="wait-msg">호스트가 게임을 시작하면 시작돼요</p>
  </div>

  <!-- 질문 -->
  <div id="s-q" class="screen">
    <div class="card" style="gap:10px;display:flex;flex-direction:column;align-items:center">
      <div class="q-counter" id="q-counter"></div>
      <h2 id="q-text" style="font-size:1.1rem;word-break:keep-all"></h2>
    </div>
    <div class="status-bar" id="q-status-bar"></div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px">
      <button id="btn-A" class="choice-btn A" onclick="submitAnswer('A')"></button>
      <button id="btn-B" class="choice-btn B" onclick="submitAnswer('B')"></button>
    </div>
    <p class="waiting-msg" id="q-wait" style="display:none">다른 플레이어를 기다리는 중…</p>
  </div>

  <!-- 결과 (단계) -->
  <div id="s-rev" class="screen">
    <h2 id="rev-title"></h2>
    <div id="rev-list" style="width:100%"></div>
    <button id="btn-next-q" class="btn btn-sec" onclick="hostNextQ()" style="display:none">다음 질문 ▶</button>
    <button id="btn-next-stage" class="btn btn-pri" onclick="hostNextStage()" style="display:none">다음 라운드 🌸</button>
    <button id="btn-to-final" class="btn btn-rose" onclick="hostToFinal()" style="display:none">최종 선택으로 💌</button>
    <p class="waiting-msg" id="rev-wait">호스트가 진행합니다…</p>
  </div>

  <!-- 로비 (스테이지 간) -->
  <div id="s-lobby" class="screen">
    <div class="lobby-icon" id="lobby-icon">✨</div>
    <h2 id="lobby-title"></h2>
    <p id="lobby-msg" style="word-break:keep-all;white-space:pre-line"></p>
    <button id="btn-lobby-go" class="btn btn-pri" onclick="hostStartStage()" style="display:none">시작! 🎯</button>
    <p class="waiting-msg" id="lobby-wait">호스트가 시작하면 시작돼요</p>
  </div>

  <!-- 최종 선택 -->
  <div id="s-final" class="screen">
    <h2>최종 선택 💌</h2>
    <p style="word-break:keep-all">함께 나가고 싶은 사람을<br>한 명 선택해요!</p>
    <div id="final-list" style="width:100%;display:flex;flex-direction:column;gap:10px"></div>
    <div class="status-bar" id="final-status-bar" style="margin-top:8px"></div>
    <p class="waiting-msg" id="final-wait" style="display:none">모두 선택할 때까지 기다려요…</p>
  </div>

  <!-- 최종 결과 -->
  <div id="s-end" class="screen">
    <h2>💘 결과 발표</h2>
    <div id="end-content" style="width:100%"></div>
    <button class="btn btn-sec" onclick="location.reload()">다시 하기 🔄</button>
  </div>

</div>
<script>
const SUPABASE_URL = 'https://gdbycodzgooqacukxwjl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkYnljb2R6Z29vcWFjdWt4d2psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDA5OTYsImV4cCI6MjA5Nzg3Njk5Nn0.pyxwi2cMK1tfEEdRi5jJ1mqUCKKhpJh1XPsM3Z5MeHc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CHARS = [
  {id:0,name:'로즈',emoji:'🌹',color:'#FFB5A7',bg:'#FFF0ED'},
  {id:1,name:'민트',emoji:'🌿',color:'#9DD9D2',bg:'#EDFAF8'},
  {id:2,name:'라벤더',emoji:'💜',color:'#C8B6E2',bg:'#F3EEFF'},
  {id:3,name:'선샤인',emoji:'☀️',color:'#FFD97D',bg:'#FFFAED'},
  {id:4,name:'오션',emoji:'🌊',color:'#80B4FF',bg:'#EEF4FF'},
  {id:5,name:'체리',emoji:'🍒',color:'#FF8FAB',bg:'#FFF0F3'},
];

const STAGES = [
  {label:'1라운드 — 첫인상',icon:'👀',msg:'서로의 첫인상을 확인해봐요!\n각자 솔직하게 선택하세요.'},
  {label:'2라운드 — 취향 탐색',icon:'🔍',msg:'취향이 맞는 사람을 찾아봐요!\n깊이 있는 선택을 해보세요.'},
  {label:'3라운드 — 최후의 선택',icon:'💎',msg:'이제 마음을 결정할 시간!\n진짜 마음을 보여주세요.'},
];

const QUESTIONS = [
  [
    {q:'주말에 어디가 더 좋아?',A:'🏠 집에서 넷플릭스',B:'🌿 야외 나들이'},
    {q:'첫 데이트 장소는?',A:'☕ 감성 카페',B:'🍽️ 분위기 좋은 레스토랑'},
    {q:'연락 스타일은?',A:'💬 자주 자주',B:'🌙 필요할 때만'},
    {q:'이상형 분위기는?',A:'😊 친근하고 밝은',B:'😎 차분하고 깊은'},
  ],
  [
    {q:'여행 스타일은?',A:'🗺️ 꼼꼼한 계획파',B:'🎲 즉흥 자유여행'},
    {q:'데이트할 때 밥은?',A:'🔥 새로운 맛집 도전',B:'🏠 집에서 요리'},
    {q:'싸웠을 때는?',A:'💬 바로 대화로 해결',B:'🌬️ 시간이 필요해'},
    {q:'영화는?',A:'😂 웃기고 가벼운 코미디',B:'😭 깊고 울리는 드라마'},
    {q:'선물 스타일은?',A:'🎁 깜짝 서프라이즈',B:'🛍️ 원하는 거 직접'},
  ],
  [
    {q:'10년 후 모습은?',A:'🏙️ 도시에서 커리어',B:'🌄 여유로운 시골'},
    {q:'사랑의 언어는?',A:'🗣️ 말로 표현',B:'🤝 행동으로 표현'},
    {q:'고민이 생기면?',A:'👥 친구에게 털어놓기',B:'🧘 혼자 정리하기'},
    {q:'인생에서 더 중요한 건?',A:'💪 성취와 목표',B:'❤️ 관계와 감정'},
  ],
];

let myId = sessionStorage.getItem('myId');
if(!myId){myId=crypto.randomUUID();sessionStorage.setItem('myId',myId);}
let roomId = sessionStorage.getItem('roomId') || null;
let channel = null;
let isHost = false;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function toast(msg,dur=2000){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),dur);
}
function randCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r='';for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r;
}
function charOf(id){return CHARS.find(c=>c.id===id)||{name:'?',emoji:'❓',color:'#ccc',bg:'#f9f9f9'};}

async function doCreate(){
  const name=document.getElementById('inp-name').value.trim();
  if(!name){toast('이름을 입력해주세요!');return;}
  const code=randCode();
  const {data:room,error}=await sb.from('rooms').insert({code,host_id:myId}).select().single();
  if(error){toast('방 생성 실패 😢');console.error(error);return;}
  roomId=room.id;sessionStorage.setItem('roomId',roomId);
  isHost=true;
  await sb.from('players').insert({id:myId,room_id:roomId,name,is_host:true});
  subscribeRoom();show('s-wait');
}
async function doJoin(){
  const name=document.getElementById('inp-name').value.trim();
  const code=document.getElementById('inp-code').value.trim().toUpperCase();
  if(!name){toast('이름을 입력해주세요!');return;}
  if(code.length!==6){toast('코드 6자리를 입력해주세요!');return;}
  const {data:room,error}=await sb.from('rooms').select().eq('code',code).single();
  if(error||!room){toast('방을 찾을 수 없어요 😢');return;}
  if(room.status!=='waiting'){toast('이미 시작된 게임이에요!');return;}
  roomId=room.id;sessionStorage.setItem('roomId',roomId);isHost=false;
  const {error:pe}=await sb.from('players').insert({id:myId,room_id:roomId,name,is_host:false});
  if(pe&&pe.code!=='23505'){toast('입장 실패 😢');console.error(pe);return;}
  subscribeRoom();show('s-wait');
}

function subscribeRoom(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('room:'+roomId);
  ['rooms','players','answers','final_choices'].forEach(tbl=>{
    channel.on('postgres_changes',{event:'*',schema:'public',table:tbl,filter:`${tbl==='rooms'?'id':'room_id'}=eq.${roomId}`},()=>syncAndRender());
  });
  channel.subscribe();
}

async function syncAndRender(){
  if(!roomId)return;
  const [r1,r2,r3,r4]=await Promise.all([
    sb.from('rooms').select().eq('id',roomId).single(),
    sb.from('players').select().eq('room_id',roomId).order('joined_at'),
    sb.from('answers').select().eq('room_id',roomId),
    sb.from('final_choices').select().eq('room_id',roomId),
  ]);
  const room=r1.data,players=r2.data||[],answers=r3.data||[],finals=r4.data||[];
  if(!room)return;
  const me=players.find(p=>p.id===myId)||{};
  isHost=me.is_host||false;
  const s=room.status;
  if(s==='waiting')renderWait(room,players,me);
  else if(s==='lobby')renderLobby(room);
  else if(s==='question')renderQ(room,players,answers);
  else if(s==='reveal')renderRev(room,players,answers);
  else if(s==='final')renderFinal(room,players,finals);
  else if(s==='ended')renderEnd(players,finals);
}

function renderWait(room,players,me){
  show('s-wait');
  document.getElementById('room-code').textContent=room.code;
  document.getElementById('player-count').textContent=players.length;
  const taken=players.filter(p=>p.char_id>=0).map(p=>p.char_id);
  document.getElementById('player-list').innerHTML=players.map(p=>{
    const c=charOf(p.char_id);
    return `<div class="player-chip" style="background:${p.char_id>=0?c.bg:'#f5f5f5'};color:${p.char_id>=0?c.color:'#bbb'}">
      ${p.char_id>=0?c.emoji:'👤'} ${p.name}${p.is_host?' 👑':''}
    </div>`;
  }).join('');
  document.getElementById('char-grid').innerHTML=CHARS.map(c=>{
    const isMine=me.char_id===c.id;
    const isTaken=taken.includes(c.id)&&!isMine;
    return `<div class="char-card ${isMine?'selected-me':''} ${isTaken?'taken':''}" onclick="selectChar(${c.id})" style="border-color:${isMine?c.color:'transparent'}">
      <div class="char-emoji">${c.emoji}</div>
      <div class="char-name">${c.name}</div>
      ${isTaken?'<div style="font-size:.65rem;color:#bbb">선택됨</div>':''}
    </div>`;
  }).join('');
  const ready=players.every(p=>p.char_id>=0)&&players.length>=2;
  document.getElementById('btn-start').style.display=isHost?'block':'none';
  document.getElementById('btn-start').disabled=!ready;
  document.getElementById('btn-start').textContent=ready?'게임 시작 🎮':`게임 시작 (${players.filter(p=>p.char_id>=0).length}/${players.length} 선택됨)`;
  document.getElementById('wait-msg').style.display=isHost?'none':'block';
}
async function selectChar(charId){
  await sb.from('players').update({char_id:charId,emoji:CHARS[charId].emoji,color:CHARS[charId].color,bg:CHARS[charId].bg}).eq('room_id',roomId).eq('id',myId);
}
async function hostStart(){
  await sb.from('rooms').update({status:'lobby',stage:0}).eq('id',roomId);
}

function renderLobby(room){
  show('s-lobby');
  const stg=STAGES[room.stage]||{icon:'✨',label:'준비됐나요?',msg:'게임을 시작해요!'};
  document.getElementById('lobby-icon').textContent=stg.icon;
  document.getElementById('lobby-title').textContent=stg.label;
  document.getElementById('lobby-msg').textContent=stg.msg;
  document.getElementById('btn-lobby-go').style.display=isHost?'block':'none';
  document.getElementById('lobby-wait').style.display=isHost?'none':'block';
}
async function hostStartStage(){
  await sb.from('rooms').update({status:'question',question_idx:0}).eq('id',roomId);
}

function renderQ(room,players,answers){
  show('s-q');
  const stage=room.stage,qi=room.question_idx;
  const qs=QUESTIONS[stage]||[];
  const q=qs[qi];if(!q)return;
  document.getElementById('q-counter').textContent=`${STAGES[stage]?.label||'질문'} · ${qi+1}/${qs.length}`;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('btn-A').textContent=q.A;
  document.getElementById('btn-B').textContent=q.B;
  const myAns=answers.find(a=>a.player_id===myId&&a.stage===stage&&a.question_idx===qi);
  const btnA=document.getElementById('btn-A'),btnB=document.getElementById('btn-B');
  if(myAns){
    btnA.className='choice-btn A'+(myAns.choice==='A'?' picked-A selected':'');
    btnB.className='choice-btn B'+(myAns.choice==='B'?' picked-B selected':'');
    document.getElementById('q-wait').style.display='block';
  } else {
    btnA.className='choice-btn A';btnB.className='choice-btn B';
    document.getElementById('q-wait').style.display='none';
  }
  document.getElementById('q-status-bar').innerHTML=players.map(p=>{
    const done=answers.some(a=>a.player_id===p.id&&a.stage===stage&&a.question_idx===qi);
    const c=charOf(p.char_id);
    return `<div class="player-chip" style="background:${done?c.bg:'#f5f5f5'};color:${done?c.color:'#bbb'}">${c.emoji} ${p.name} ${done?'✓':'…'}</div>`;
  }).join('');
  const allDone=players.every(p=>answers.some(a=>a.player_id===p.id&&a.stage===stage&&a.question_idx===qi));
  if(allDone&&myAns){
    sb.from('rooms').update({status:'reveal'}).eq('id',roomId).eq('status','question').then(()=>{});
  }
}
async function submitAnswer(choice){
  const {data:room}=await sb.from('rooms').select('stage,question_idx').eq('id',roomId).single();
  await sb.from('answers').upsert({room_id:roomId,player_id:myId,stage:room.stage,question_idx:room.question_idx,choice},{onConflict:'room_id,player_id,stage,question_idx'});
}

function renderRev(room,players,answers){
  show('s-rev');
  const stage=room.stage,qi=room.question_idx;
  const qs=QUESTIONS[stage]||[],q=qs[qi];
  document.getElementById('rev-title').textContent=q?.q||'결과';
  document.getElementById('rev-list').innerHTML=answers.filter(a=>a.stage===stage&&a.question_idx===qi).map(a=>{
    const p=players.find(pl=>pl.id===a.player_id)||{};
    const c=charOf(p.char_id);
    return `<div class="result-row">
      <span style="font-size:1.5rem">${c.emoji}</span>
      <span style="font-weight:700;color:${c.color}">${p.name}</span>
      <span style="flex:1;text-align:right;font-size:.9rem;background:${a.choice==='A'?'#FFB5A7':'#9DD9D2'};color:#fff;padding:3px 10px;border-radius:10px">
        ${a.choice==='A'?(q?.A||'A'):(q?.B||'B')}
      </span>
    </div>`;
  }).join('');
  const isLastQ=qi>=(qs.length-1);
  const isLastStage=stage>=(QUESTIONS.length-1);
  document.getElementById('btn-next-q').style.display=isHost&&!isLastQ?'block':'none';
  document.getElementById('btn-next-stage').style.display=isHost&&isLastQ&&!isLastStage?'block':'none';
  document.getElementById('btn-to-final').style.display=isHost&&isLastQ&&isLastStage?'block':'none';
  document.getElementById('rev-wait').style.display=isHost?'none':'block';
}
async function hostNextQ(){
  const {data:room}=await sb.from('rooms').select('question_idx').eq('id',roomId).single();
  await sb.from('rooms').update({status:'question',question_idx:room.question_idx+1}).eq('id',roomId);
}
async function hostNextStage(){
  const {data:room}=await sb.from('rooms').select('stage').eq('id',roomId).single();
  await sb.from('rooms').update({status:'lobby',stage:room.stage+1,question_idx:0}).eq('id',roomId);
}
async function hostToFinal(){
  await sb.from('rooms').update({status:'final'}).eq('id',roomId);
}

function renderFinal(room,players,finals){
  show('s-final');
  const myFinal=finals.find(f=>f.player_id===myId);
  document.getElementById('final-list').innerHTML=players.filter(p=>p.id!==myId).map(p=>{
    const c=charOf(p.char_id),picked=myFinal?.target_id===p.id;
    return `<button onclick="submitFinal('${p.id}')" style="width:100%;padding:14px;border:3px solid ${picked?c.color:'#eee'};border-radius:16px;background:${picked?c.bg:'#fff'};cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s${myFinal?';pointer-events:none':''}">
      <span style="font-size:2rem">${c.emoji}</span>
      <span style="font-weight:700;color:${c.color};font-size:1rem">${p.name}</span>
      ${picked?`<span style="margin-left:auto;color:${c.color}">💌</span>`:''}
    </button>`;
  }).join('');
  document.getElementById('final-status-bar').innerHTML=players.map(p=>{
    const done=finals.some(f=>f.player_id===p.id);
    const c=charOf(p.char_id);
    return `<div class="player-chip" style="background:${done?c.bg:'#f5f5f5'};color:${done?c.color:'#bbb'}">${c.emoji} ${p.name} ${done?'✓':'…'}</div>`;
  }).join('');
  document.getElementById('final-wait').style.display=myFinal?'block':'none';
  if(players.length>0&&players.every(p=>finals.some(f=>f.player_id===p.id))){
    sb.from('rooms').update({status:'ended'}).eq('id',roomId).eq('status','final').then(()=>{});
  }
}
async function submitFinal(targetId){
  await sb.from('final_choices').upsert({room_id:roomId,player_id:myId,target_id:targetId},{onConflict:'room_id,player_id'});
}

function renderEnd(players,finals){
  show('s-end');
  const matches=[],used=new Set();
  players.forEach(p=>{
    if(used.has(p.id))return;
    const chosen=finals.find(f=>f.player_id===p.id)?.target_id;
    if(!chosen)return;
    const reverse=finals.find(f=>f.player_id===chosen)?.target_id;
    if(reverse===p.id&&!used.has(chosen)){
      matches.push([p,players.find(pl=>pl.id===chosen)]);
      used.add(p.id);used.add(chosen);
    }
  });
  let html='';
  if(matches.length===0){
    html=`<div class="card" style="text-align:center;margin-bottom:16px"><div style="font-size:3rem">🐱</div><p style="margin-top:12px;color:#aaa">이번엔 아무도 매칭되지 않았어요.<br>다음엔 꼭 연결되길! 🍀</p></div>`;
  } else {
    html=matches.map(([a,b])=>{
      const ca=charOf(a.char_id),cb=charOf(b.char_id);
      return `<div class="card" style="text-align:center;margin-bottom:12px">
        <div class="match-badge" style="margin-bottom:10px">💘 MATCH!</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px">
          <div><div style="font-size:2.5rem">${ca.emoji}</div><div style="font-weight:700;color:${ca.color}">${a.name}</div></div>
          <div style="font-size:1.5rem">❤️</div>
          <div><div style="font-size:2.5rem">${cb.emoji}</div><div style="font-weight:700;color:${cb.color}">${b.name}</div></div>
        </div>
      </div>`;
    }).join('');
  }
  html+=`<div class="card"><div class="section-label" style="margin-bottom:10px">모두의 선택</div>`;
  players.forEach(p=>{
    const c=charOf(p.char_id);
    const chosen=finals.find(f=>f.player_id===p.id)?.target_id;
    const target=players.find(pl=>pl.id===chosen);
    const ct=charOf(target?.char_id);
    html+=`<div class="result-row"><span style="font-size:1.4rem">${c.emoji}</span><span style="font-weight:700;color:${c.color}">${p.name}</span><span style="margin-left:auto">→</span><span style="font-size:1.4rem">${target?ct.emoji:'❓'}</span><span style="font-weight:600;color:${ct.color}">${target?.name||'?'}</span></div>`;
  });
  html+='</div>';
  document.getElementById('end-content').innerHTML=html;
}
</script>
</body>
</html>
