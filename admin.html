<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나랑 나갈래? — 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0f0;min-height:100vh;padding:20px}
h1{font-size:1.3rem;color:#C8B6E2;margin-bottom:4px;letter-spacing:.05em}
.subtitle{font-size:.75rem;color:#666;margin-bottom:20px}
.login-wrap{max-width:320px;margin:80px auto;background:#1a1a2e;border-radius:16px;padding:32px;border:1px solid #333}
.login-wrap h2{color:#C8B6E2;margin-bottom:20px;text-align:center}
input[type=password]{width:100%;padding:10px 14px;border-radius:10px;border:2px solid #333;background:#0f0f1a;color:#e0e0f0;font-size:.95rem;margin-bottom:12px;outline:none}
input[type=password]:focus{border-color:#7B5EA7}
button.login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#7B5EA7,#C8B6E2);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat-card{background:#1a1a2e;border-radius:12px;padding:14px 20px;border:1px solid #2a2a4a;min-width:120px}
.stat-card .val{font-size:2rem;font-weight:800;color:#C8B6E2}
.stat-card .lbl{font-size:.72rem;color:#888;margin-top:2px}
.rooms-grid{display:flex;flex-direction:column;gap:10px}
.room-card{background:#1a1a2e;border-radius:14px;border:1px solid #2a2a4a;overflow:hidden;cursor:pointer;transition:border-color .2s}
.room-card:hover{border-color:#7B5EA7}
.room-card.expanded{border-color:#C8B6E2}
.room-header{display:flex;align-items:center;gap:12px;padding:14px 16px}
.room-code{font-size:1.1rem;font-weight:800;color:#C8B6E2;font-family:monospace;background:#0f0f1a;padding:3px 10px;border-radius:8px}
.status-badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px}
.room-meta{margin-left:auto;font-size:.75rem;color:#666;text-align:right}
.room-detail{display:none;border-top:1px solid #2a2a4a;padding:14px 16px;background:#0f0f1a}
.room-card.expanded .room-detail{display:block}
.player-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.player-chip{background:#1a1a2e;border:1px solid #333;border-radius:20px;padding:4px 12px;font-size:.78rem;display:flex;align-items:center;gap:6px}
.player-chip.host{border-color:#C8B6E2;color:#C8B6E2}
.stage-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.stage-dot{width:10px;height:10px;border-radius:50%;background:#333}
.stage-dot.done{background:#7B5EA7}
.stage-dot.active{background:#C8B6E2;box-shadow:0 0 6px #C8B6E2}
.section-lbl{font-size:.68rem;color:#666;font-weight:700;letter-spacing:.08em;margin-bottom:6px;margin-top:10px;text-transform:uppercase}
.empty{text-align:center;color:#444;padding:40px;font-size:.9rem}
.refresh-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.refresh-bar .dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.3}}
.btn-sm{padding:5px 14px;border-radius:8px;border:1px solid #444;background:#1a1a2e;color:#C8B6E2;font-size:.75rem;cursor:pointer}
.btn-sm:hover{border-color:#7B5EA7}
.answer-row{display:flex;align-items:center;gap:8px;font-size:.75rem;padding:4px 0;border-bottom:1px solid #1a1a2e}
.choice-a{background:#FF6B9D33;color:#FF6B9D;padding:2px 8px;border-radius:6px;font-weight:700}
.choice-b{background:#6B9DFF33;color:#6B9DFF;padding:2px 8px;border-radius:6px;font-weight:700}
.hidden-badge{background:#3d1a6e;color:#D4A0FF;border:1px solid #9B6FD0;padding:2px 8px;border-radius:6px;font-size:.65rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th{color:#666;font-weight:600;text-align:left;padding:4px 8px;border-bottom:1px solid #2a2a4a}
td{padding:4px 8px;border-bottom:1px solid #1a1a2e;color:#ccc}
.status-waiting{background:#333;color:#aaa}
.status-lobby{background:#1a3a1a;color:#4CAF50}
.status-question,.status-reveal{background:#1a2a3a;color:#6B9DFF}
.status-final,.status-ended{background:#3a1a3a;color:#C8B6E2}
.status-hidden_consent,.status-hidden_stage,.status-hidden_reveal{background:#3d1a6e;color:#D4A0FF}
.status-making_custom_q,.status-answering_custom_q,.status-revealing_custom_q{background:#3a2a1a;color:#FFB5A7}
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <h2>🔐 관리자 로그인</h2>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div id="login-err" style="color:#FF6B9D;font-size:.78rem;margin-top:10px;text-align:center"></div>
  </div>
</div>

<div id="admin-screen" style="display:none">
  <h1>🎮 나랑 나갈래? — 관리자</h1>
  <div class="subtitle">실시간 게임 모니터링</div>

  <div class="refresh-bar">
    <div class="dot"></div>
    <span style="font-size:.75rem;color:#666">실시간 연결됨</span>
    <span id="last-updated" style="font-size:.72rem;color:#444"></span>
    <button class="btn-sm" onclick="loadAll()">↻ 새로고침</button>
  </div>

  <div class="stats" id="stats-bar"></div>
  <div class="rooms-grid" id="rooms-grid"></div>
</div>

<script>
const ADMIN_PW='nagalae2025';
const SB_URL='https://gdbycodzgooqacukxwjl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkYnljb2R6Z29vcWFjdWt4d2psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDA5OTYsImV4cCI6MjA5Nzg3Njk5Nn0.pyxwi2cMK1tfEEdRi5jJ1mqUCKKhpJh1XPsM3Z5MeHc';
const sb=supabase.createClient(SB_URL,SB_KEY);

const STATUS_LABELS={
  waiting:'대기중',lobby:'로비',question:'질문',reveal:'결과공개',
  final:'최종선택',ended:'종료',making_custom_q:'커스텀질문준비',
  answering_custom_q:'커스텀질문답변',revealing_custom_q:'커스텀질문결과',
  hidden_consent:'히든동의',hidden_stage:'히든스테이지',hidden_reveal:'히든결과'
};

let expandedRooms=new Set();
let allData={rooms:[],players:[],answers:[],finals:[]};

function doLogin(){
  const pw=document.getElementById('pw-input').value;
  if(pw===ADMIN_PW){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('admin-screen').style.display='block';
    init();
  } else {
    document.getElementById('login-err').textContent='비밀번호가 틀렸어요';
  }
}

async function init(){
  await loadAll();
  // Realtime: re-load on any change
  const ch=sb.channel('admin-monitor');
  ['rooms','players','answers','final_choices'].forEach(t=>{
    ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll());
  });
  ch.subscribe();
}

async function loadAll(){
  const [r1,r2,r3,r4]=await Promise.all([
    sb.from('rooms').select('*').order('created_at',{ascending:false}),
    sb.from('players').select('*').order('joined_at'),
    sb.from('answers').select('*'),
    sb.from('final_choices').select('*'),
  ]);
  allData={
    rooms:r1.data||[],
    players:r2.data||[],
    answers:r3.data||[],
    finals:r4.data||[]
  };
  render();
  document.getElementById('last-updated').textContent='업데이트: '+new Date().toLocaleTimeString('ko-KR');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderStats(rooms,players){
  const active=rooms.filter(r=>r.status!=='ended'&&r.status!=='waiting');
  const ended=rooms.filter(r=>r.status==='ended');
  const hidden=rooms.filter(r=>['hidden_consent','hidden_stage','hidden_reveal'].includes(r.status));
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card"><div class="val">${rooms.length}</div><div class="lbl">전체 방</div></div>
    <div class="stat-card"><div class="val">${active.length}</div><div class="lbl">진행 중</div></div>
    <div class="stat-card"><div class="val">${ended.length}</div><div class="lbl">종료된 방</div></div>
    <div class="stat-card"><div class="val">${players.length}</div><div class="lbl">전체 플레이어</div></div>
    <div class="stat-card"><div class="val" style="color:#D4A0FF">${hidden.length}</div><div class="lbl">히든스테이지</div></div>
  `;
}

function getCouples(roomPlayers,roomFinals){
  const matches=[],used=new Set();
  roomPlayers.forEach(p=>{
    if(used.has(p.id))return;
    const ch=roomFinals.find(f=>f.player_id===p.id)?.target_id;
    if(!ch||ch==='__cat__')return;
    const rv=roomFinals.find(f=>f.player_id===ch)?.target_id;
    if(rv===p.id&&!used.has(ch)){
      matches.push([p,roomPlayers.find(pl=>pl.id===ch)]);
      used.add(p.id);used.add(ch);
    }
  });
  return matches;
}

function render(){
  const {rooms,players,answers,finals}=allData;
  renderStats(rooms,players);

  if(!rooms.length){
    document.getElementById('rooms-grid').innerHTML='<div class="empty">아직 생성된 방이 없어요</div>';
    return;
  }

  document.getElementById('rooms-grid').innerHTML=rooms.map(room=>{
    const rPlayers=players.filter(p=>p.room_id===room.id);
    const rAnswers=answers.filter(a=>a.room_id===room.id);
    const rFinals=finals.filter(f=>f.room_id===room.id);
    const host=rPlayers.find(p=>p.is_host);
    const expanded=expandedRooms.has(room.id);
    const statusClass='status-'+room.status;
    const statusLabel=STATUS_LABELS[room.status]||room.status;
    const isHidden=['hidden_consent','hidden_stage','hidden_reveal'].includes(room.status);
    const cq=room.custom_q?tryParse(room.custom_q):null;
    const hiddenHistory=cq?.hiddenHistory||[];
    const age=Math.floor((Date.now()-new Date(room.created_at))/60000);

    let detailHtml='';
    if(expanded){
      // Players
      const playerChips=rPlayers.map(p=>`
        <div class="player-chip ${p.is_host?'host':''}">
          ${p.is_host?'👑 ':''}${esc(p.name)}
          ${rFinals.find(f=>f.player_id===p.id)?'<span style="color:#C8B6E2">💌</span>':''}
        </div>`).join('');

      // Stage progress
      const STAGES=['자기탐색','가치관','마지막시험'];
      const stageDots=STAGES.map((_,i)=>{
        const done=room.stage>i+1||(room.stage===i+1&&['lobby','final','ended'].includes(room.status));
        const active=room.stage===i+1&&!['lobby','ended'].includes(room.status);
        return `<div class="stage-dot ${done?'done':''} ${active?'active':''}" title="${STAGES[i]}"></div>`;
      }).join('');

      // Recent answers (last 10)
      const recent=rAnswers.slice(-12).reverse();
      const answerRows=recent.map(a=>{
        const p=rPlayers.find(pl=>pl.id===a.player_id)||{name:'?'};
        const isHiddenAns=a.stage===98;
        const isCQAns=a.stage===99;
        return `<tr>
          <td>${esc(p.name)}</td>
          <td>${isHiddenAns?'<span class="hidden-badge">히든</span>':isCQAns?'커스텀':`S${a.stage}Q${a.question_idx}`}</td>
          <td><span class="${a.choice==='A'?'choice-a':'choice-b'}">${a.choice}</span></td>
        </tr>`;
      }).join('');

      // Couples if ended/hidden
      let couplesHtml='';
      if(['ended','hidden_consent','hidden_stage','hidden_reveal'].includes(room.status)&&rFinals.length){
        const couples=getCouples(rPlayers,rFinals);
        if(couples.length){
          const hiddenEmojis=cq?.hiddenEmojis||{};
          const coupleEmojis=cq?.coupleEmojis||[];
          couplesHtml=`<div class="section-lbl">💕 커플 매칭</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            ${couples.map(([a,b])=>{
              const ce=coupleEmojis.find(c=>(c.pA===a.id&&c.pB===b.id)||(c.pA===b.id&&c.pB===a.id));
              const emojiStr=ce?` ${ce.eA}${ce.heart}${ce.eB}`:'';
              return `<div style="background:#2d1057;border:1px solid #9B6FD0;border-radius:10px;padding:5px 12px;font-size:.78rem;color:#D4A0FF">${esc(a.name)} 💜 ${esc(b.name)}${emojiStr}</div>`;
            }).join('')}
          </div>`;
        }
      }

      // Hidden stage questions
      let hiddenHtml='';
      if(hiddenHistory.length){
        hiddenHtml=`<div class="section-lbl">✦ 히든 스테이지 질문 이력</div>
        <div style="margin-bottom:10px">${hiddenHistory.map(h=>`
          <div style="font-size:.73rem;color:#D4A0FF;padding:4px 0;border-bottom:1px solid #2a2a4a">
            Q${h.qi}. ${esc(h.q)}
            <span style="color:#666;margin-left:6px">A:${esc(h.A?.replace(/^❤️\s*/,''))} / B:${esc(h.B?.replace(/^💙\s*/,''))}</span>
          </div>`).join('')}
        </div>`;
      }

      detailHtml=`
        <div class="section-lbl">플레이어 (${rPlayers.length}명)</div>
        <div class="player-list">${playerChips}</div>
        <div class="section-lbl">스테이지 진행</div>
        <div class="stage-bar" style="margin-bottom:10px">
          ${stageDots}
          <span style="font-size:.72rem;color:#666;margin-left:6px">S${room.stage} / Q${room.question_idx}</span>
        </div>
        ${couplesHtml}
        ${hiddenHtml}
        ${rAnswers.length?`<div class="section-lbl">최근 답변</div>
        <table><thead><tr><th>플레이어</th><th>질문</th><th>선택</th></tr></thead>
        <tbody>${answerRows}</tbody></table>`:''}
      `;
    }

    return `<div class="room-card ${expanded?'expanded':''}" id="room-${room.id}">
      <div class="room-header" onclick="toggleRoom('${room.id}')">
        <div class="room-code">${esc(room.code||room.id.slice(0,6))}</div>
        <span class="status-badge ${statusClass}">${statusLabel}</span>
        ${isHidden?'<span class="hidden-badge">✦ HIDDEN</span>':''}
        <div class="room-meta">
          <div>${rPlayers.length}명 참여 · ${age}분 전</div>
          <div style="color:#555">${host?'방장: '+esc(host.name):''}</div>
        </div>
        <span style="color:#444;font-size:.8rem;margin-left:4px">${expanded?'▲':'▼'}</span>
      </div>
      ${expanded?`<div class="room-detail">${detailHtml}</div>`:''}
    </div>`;
  }).join('');
}

function tryParse(s){try{return JSON.parse(s)}catch{return null}}

function toggleRoom(id){
  if(expandedRooms.has(id))expandedRooms.delete(id);
  else expandedRooms.add(id);
  render();
}

// Init: show login
document.getElementById('login-screen').style.display='block';
</script>
</body>
</html>
